defaults:
- models/mematte_small.yaml
- runtime.yaml
- datasets.yaml
stage: matter
teacher:
  _target_: mam2.models.mematte.vit_teacher.ViT_Teacher
  in_chans: 4
  img_size: 1024
  patch_size: 16
  embed_dim: 384
  depth: 12
  num_heads: 6
  drop_path_rate: 0
  window_size: 14
  mlp_ratio: 4
  qkv_bias: true
  norm_layer:
    _target_: functools.partial
    _args_:
    - _target_: hydra.utils.get_class
      path: torch.nn.LayerNorm
    eps: 1.0e-06
  window_block_indexes:
  - 0
  - 1
  - 3
  - 4
  - 6
  - 7
  - 9
  - 10
  residual_block_indexes:
  - 2
  - 5
  - 8
  - 11
  use_rel_pos: true
  out_feature: last_feat
training:
  iterations: 3500
  batch_size: 2
  workers: 4
  learning_rate: 0.0005
  weight_decay: 0.1
  checkpoint_every: 500
  log_every: 20
  gradient_clip: null
  init_checkpoint: null
  resume_checkpoint: null
  teacher_checkpoint: ???
  resize_teacher_position_embeddings: true
  distillation_weight: 1.0
  routing_weight: 1.0
augmentation:
  crop_size: 1024
  degrees: 30
  scale:
  - 0.8
  - 1.25
  shear: 10
  flip: 0.5
  cutmask_prob: 0.25
  random_interpolation: true
  composite_prob: 0.5
  resize_prob: 0.25
  resize_size: 640
loss:
  _target_: mam2.training.matting_losses.MattingLoss
  weights:
    unknown_l1: 1.0
    known_l1: 1.0
    l2: 1.0
    laplacian: 1.0
    gradient: 1.0
  laplacian_levels: 5
  gradient_regularization: 0.01
launcher:
  experiment_log_dir: outputs/train_matter
