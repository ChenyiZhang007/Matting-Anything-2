defaults:
- models/mam2_hiera_large.yaml
- runtime.yaml
- datasets.yaml
stage: main
scratch:
  resolution: 1024
  num_train_workers: 10
  max_num_objects: 3
  base_lr: 5.0e-06
  vision_lr: 3.0e-06
  phases_per_epoch: 1
  num_epochs: 100
dataset:
  multiplier: 2
vos:
  train_transforms:
  - _target_: mam2.training.dataset.transforms.ComposeAPI
    transforms:
    - _target_: mam2.training.dataset.transforms.RandomHorizontalFlip
      consistent_transform: true
    - _target_: mam2.training.dataset.transforms.RandomAffine
      degrees: 25
      shear: 20
      image_interpolation: bilinear
      consistent_transform: true
    - _target_: mam2.training.dataset.transforms.RandomResizeAPI
      sizes: ${scratch.resolution}
      square: true
      consistent_transform: true
    - _target_: mam2.training.dataset.transforms.ColorJitter
      consistent_transform: true
      brightness: 0.1
      contrast: 0.03
      saturation: 0.03
      hue: null
    - _target_: mam2.training.dataset.transforms.RandomGrayscale
      p: 0.05
      consistent_transform: true
    - _target_: mam2.training.dataset.transforms.ColorJitter
      consistent_transform: false
      brightness: 0.1
      contrast: 0.05
      saturation: 0.05
      hue: null
    - _target_: mam2.training.dataset.transforms.ToTensorAPI
    - _target_: mam2.training.dataset.transforms.NormalizeAPI
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
matting:
  train_transforms:
  - _target_: mam2.training.dataset.transforms.ComposeAPI
    transforms:
    - _target_: mam2.training.dataset.transforms.RandomHorizontalFlip
      consistent_transform: true
    - _target_: mam2.training.dataset.transforms.RandomAffine
      degrees: 25
      shear: 20
      image_interpolation: bilinear
      consistent_transform: true
    - _target_: mam2.training.dataset.transforms.RandomResizeAPI
      sizes: ${scratch.resolution}
      square: true
      consistent_transform: true
    - _target_: mam2.training.dataset.transforms.ColorJitter
      consistent_transform: true
      brightness: 0.1
      contrast: 0.03
      saturation: 0.03
      hue: null
    - _target_: mam2.training.dataset.transforms.RandomGrayscale
      p: 0.05
      consistent_transform: true
    - _target_: mam2.training.dataset.transforms.ColorJitter
      consistent_transform: false
      brightness: 0.1
      contrast: 0.05
      saturation: 0.05
      hue: null
    - _target_: mam2.training.dataset.transforms.GenTrimap
      consistent_transform: true
      synthesis_size: [640, 640]
      foreground_erosion: 7
      background_erosion: 7
    - _target_: mam2.training.dataset.transforms.ToTensorAPI
    - _target_: mam2.training.dataset.transforms.NormalizeAPI
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
model:
  prompt_seed: 42
  prob_to_use_pt_input_for_train: 1
  prob_to_use_pt_input_for_eval: 0.0
  prob_to_use_box_input_for_train: 1
  prob_to_use_box_input_for_eval: 0.0
  prob_to_sample_from_gt_for_train: 0.1
  num_frames_to_correct_for_train: 2
  num_frames_to_correct_for_eval: 1
  rand_frames_to_correct_for_train: true
  add_all_frames_to_correct_as_cond: true
  num_init_cond_frames_for_train: 2
  rand_init_cond_frames_for_train: true
  num_correction_pt_per_frame: 7
  use_act_ckpt_iterative_pt_sampling: false
  num_init_cond_frames_for_eval: 1
  forward_backbone_per_frame_for_eval: true
  _target_: mam2.training.model.sam2.SAM2Train
  image_size: ${scratch.resolution}
trainer:
  _target_: mam2.training.trainer.Trainer
  mode: train_only
  max_epochs: ${times:${scratch.num_epochs},${scratch.phases_per_epoch}}
  accelerator: ${device_type:${runtime.device}}
  seed_value: ${runtime.seed}
  cuda:
    allow_tf32: ${runtime.allow_tf32}
  model: ${model}
  data:
    train:
      _target_: mam2.training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: ${scratch.phases_per_epoch}
      seed: ${runtime.seed}
      batch_sizes:
      - 4
      - 4
      - 1
      - 1
      datasets:
      - _target_: mam2.training.dataset.vos_dataset.SegmentationDataset
        multiplier: ${dataset.multiplier}
        training: true
        video_dataset:
          _target_: mam2.training.dataset.images.ImageSegmentationRawDataset
          sources: ${data.segmentation_sources}
        sampler:
          _target_: mam2.training.dataset.vos_sampler.RandomUniformSampler
          num_frames: 1
          max_num_objects: ${scratch.max_num_objects}
        # Segmentation data supervises masks and must not generate trimaps.
        transforms: ${vos.train_transforms}
      - _target_: mam2.training.dataset.vos_dataset.MattingDataset
        multiplier: ${dataset.multiplier}
        training: true
        video_dataset:
          _target_: mam2.training.dataset.images.ImageMattingRawDataset
          sources: ${data.matting_sources}
          background_folder: ${paths.backgrounds}
        sampler:
          _target_: mam2.training.dataset.vos_sampler.RandomUniformSampler
          num_frames: 1
          max_num_objects: ${scratch.max_num_objects}
        transforms: ${matting.train_transforms}
      - _target_: mam2.training.dataset.vos_dataset.VideoMattingDataset
        multiplier: ${dataset.multiplier}
        training: true
        bg_dict_path: ${paths.vm_correspondence}
        video_dataset:
          _target_: mam2.training.dataset.vos_raw_dataset.VideoMattingRawDataset
          fg_folder: ${paths.vm_foregrounds}
          bg_folder: ${paths.vm_backgrounds}
          foreground_subdirectory: img
          alpha_subdirectory: alpha
          image_extensions: ['.jpg', '.jpeg', '.png']
          alpha_extension: .png
          file_list_txt: ${paths.vm_split}
        sampler:
          _target_: mam2.training.dataset.vos_sampler.RandomUniformSampler
          num_frames: 4
          max_num_objects: ${scratch.max_num_objects}
        transforms: ${matting.train_transforms}
      - _target_: mam2.training.dataset.vos_dataset.VOSDataset
        multiplier: ${dataset.multiplier}
        training: true
        video_dataset:
          _target_: mam2.training.dataset.vos_raw_dataset.PNGRawDataset
          img_folder: ${paths.vos_images}
          gt_folder: ${paths.vos_masks}
          file_list_txt: ${paths.vos_split}
        sampler:
          _target_: mam2.training.dataset.vos_sampler.RandomUniformSampler
          num_frames: 4
          max_num_objects: ${scratch.max_num_objects}
        transforms: ${vos.train_transforms}
      shuffle: true
      num_workers: ${scratch.num_train_workers}
      pin_memory: true
      drop_last: true
      collate_fn:
        _target_: mam2.training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: all
      dataset_prob:
      - 0.25
      - 0.25
      - 0.25
      - 0.25
  optim:
    amp:
      enabled: ${amp_enabled:${runtime.precision}}
      amp_dtype: ${runtime.precision}
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: mam2.training.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    param_group_modifiers:
    - _target_: mam2.training.optimizer.layer_decay_param_modifier
      _partial_: true
      layer_decay_value: 0.9
      apply_to: image_encoder.trunk
      overrides:
      - pattern: '*pos_embed*'
        value: 1.0
    options:
      lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: ${scratch.base_lr}
          end_value: ${divide:${scratch.base_lr},10}
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: ${scratch.vision_lr}
          end_value: ${divide:${scratch.vision_lr},10}
        param_names:
        - image_encoder.*
      weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.1
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0
        param_names:
        - '*bias*'
        module_cls_names:
        - torch.nn.LayerNorm
  loss:
    all:
      _target_: mam2.training.loss_fns.MultiStepMultiMasksAndIous
      weight_dict:
        loss_mask: 20
        loss_dice: 1
        loss_iou: 1
        loss_class: 1
      supervise_all_iou: true
      iou_use_l1_loss: true
      pred_obj_scores: true
      focal_gamma_obj_score: 0.0
      focal_alpha_obj_score: -1.0
  distributed:
    backend: nccl
    find_unused_parameters: true
  logging:
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 10
    model_weight_initializer:
      _target_: mam2.checkpoints.initialize_main
      _partial_: true
      checkpoint_path: ${paths.sam2_checkpoint}
      allowed_missing:
      - pdd.trimap_tokens.*
      - pdd.trimap_output_hypernetworks_mlps.*
      - pdd.matting_output_upscaling.*
      - pdd.fusion.*
      - memory_encoder.trimap_downsampler.*
      - memory_encoder.fuser_trimap.*
  lora: ${lora}
launcher:
  experiment_log_dir: outputs/train_main
